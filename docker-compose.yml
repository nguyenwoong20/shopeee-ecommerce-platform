services:
  postgres-service:
    image: postgres:16-alpine
    container_name: shopeee-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-shopeee_db}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  shopeee-backend-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shopeee-backend
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-service:5432/${POSTGRES_DB:-shopeee_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}

  shopeee-frontend-service:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shopeee-frontend
    restart: always
    ports:
      - "30092:80"
    depends_on:
      - shopeee-backend-service

volumes:
  postgres-data:
